<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIRUSCRIPT - GET KEY</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Quicksand', sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.wrapper {
    padding: 4px;
    border-radius: 15px;
    background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
    background-size: 400%;
    animation: rainbow 4s linear infinite;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    width: 320px;
}

h2 {
    margin-bottom: 10px;
}

.btn {
    background: linear-gradient(90deg, #007bff, #00c6ff);
    border: none;
    padding: 10px 25px;
    border-radius: 25px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
}

.loading {
    display: none;
    margin-top: 15px;
    font-weight: bold;
}

@keyframes rainbow {
    0% {background-position: 0%}
    100% {background-position: 400%}
}
</style>
</head>

<body>

<div class="wrapper">
    <div class="container">
        <h2>HIRUSCRIPT</h2>
        <p>Script</p>

        <button class="btn" onclick="goLink()">GET KEY</button>

        <div class="loading" id="loading">Đang chuyển hướng...</div>
    </div>
</div>

<script>
function goLink() {
    document.getElementById("loading").style.display = "block";

    setTimeout(function() {
        // 👉 Thay link này bằng link linkngon của bạn
        window.location.href = "https://linkngon.com/yourlink";
    }, 1500);
}
</script>

</body>
</html>
